name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install PyTorch (CPU build)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install
        run: python -m pip install -e ".[dev,ml,plots]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
