# Training config for the PyTorch MLP (`foilnet train`). The values come from the
# validation-set search recorded in docs/hyperparameters.md.

[model]
hidden = [128, 128]
activation = "tanh"

[train]
epochs = 400
batch_size = 128
learning_rate = 0.01
weight_decay = 0.0001
schedule = "cosine"   # decays to 1% of learning_rate; "constant" is much worse
patience = 0          # 0 = always run all epochs, then restore the best one
seed = 0

[split]
train = 0.7
val = 0.15
test = 0.15
