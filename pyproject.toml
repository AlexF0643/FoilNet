[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foilnet"
version = "0.0.1"
description = "A neural-network surrogate for aerofoil aerodynamics, trained on data from a panel-method solver."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Forbes" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
foilnet = "foilnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
