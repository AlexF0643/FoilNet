<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoilNet viewer</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --panel: #f4f3f0; --ink: #0b0b0b; --ink-2: #52514e; --grid: #e4e3df;
  --solver: #2a78d6; --net: #eb6834; --band: rgba(235, 104, 52, 0.18);
  --trained: rgba(42, 120, 214, 0.07); --range: rgba(42, 120, 214, 0.28); --fill: #e9e8e4; --warn: #8a4b00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --panel: #232322; --ink: #f3f2ee; --ink-2: #a8a7a2; --grid: #383835;
    --solver: #3987e5; --net: #d95926; --band: rgba(217, 89, 38, 0.28);
    --trained: rgba(57, 135, 229, 0.12); --range: rgba(57, 135, 229, 0.4);
    --fill: #2c2c2a; --warn: #f0b060;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface: #1a1a19; --panel: #232322; --ink: #f3f2ee; --ink-2: #a8a7a2; --grid: #383835;
  --solver: #3987e5; --net: #d95926; --band: rgba(217, 89, 38, 0.28);
  --trained: rgba(57, 135, 229, 0.12); --range: rgba(57, 135, 229, 0.4);
  --fill: #2c2c2a; --warn: #f0b060;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
main { max-width: 1180px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 2px; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--ink-2);
     text-transform: uppercase; letter-spacing: 0.04em; }
.sub { color: var(--ink-2); margin: 0 0 16px; }
.layout { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .layout { grid-template-columns: 330px 1fr; } }
.card { background: var(--panel); border-radius: 8px; padding: 14px; }
.stack { display: grid; gap: 16px; align-content: start; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
button, select {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--grid); border-radius: 6px; padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--ink-2); }
button[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--solver); outline-offset: 2px; }
.slider { margin-bottom: 10px; }
.slider .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slider label { font-weight: 500; }
.slider .hint { color: var(--ink-2); font-size: 12px; }
.slider input[type="number"] {
  width: 84px; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--grid); border-radius: 6px; padding: 2px 6px; text-align: right;
}
.slider input[type="range"] {
  width: 100%; margin: 8px 0 2px; height: 6px; border-radius: 3px; cursor: pointer;
  -webkit-appearance: none; appearance: none; background: var(--grid);
}
.slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
  background: var(--ink); border: 2px solid var(--surface);
}
.slider input[type="range"]::-moz-range-thumb {
  width: 12px; height: 12px; border-radius: 50%; background: var(--ink); border: 2px solid var(--surface);
}
.slider .flag { color: var(--warn); font-size: 12px; min-height: 16px; }
.readouts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.readout .label { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.swatch.line { width: 22px; height: 3px; border-radius: 2px; }
.readout .big { font-size: 22px; font-variant-numeric: tabular-nums; }
.readout .small { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
.tabs .spacer { flex: 1; }
svg { display: block; width: 100%; height: auto; }
svg text { fill: var(--ink-2); font: 12px system-ui, sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 13px; margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.note { color: var(--ink-2); font-size: 13px; margin: 8px 0 0; }
#warnings { margin: 0; padding: 0; list-style: none; color: var(--warn); }
#warnings li { margin-bottom: 4px; }
#warnings li::before { content: "\26A0\FE0E  "; }
#error { color: var(--warn); min-height: 20px; }
.wrap { position: relative; }
#tip {
  position: absolute; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--grid); border-radius: 6px; padding: 6px 8px; font-size: 13px;
  font-variant-numeric: tabular-nums; white-space: nowrap; display: none;
}
table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
th, td { text-align: right; padding: 2px 10px; border-bottom: 1px solid var(--grid); }
details { margin-top: 8px; color: var(--ink-2); }
details .scroll { max-height: 260px; overflow: auto; }
.checks { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; color: var(--ink-2); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>FoilNet viewer</h1>
  <p class="sub" id="sub">Loading the model...</p>
  <div class="layout">
    <div class="stack">
      <section class="card" aria-label="Shape controls">
        <h2>Shape</h2>
        <div class="presets" id="presets"></div>
        <div id="sliders"></div>
        <button id="reset" type="button">Reset</button>
      </section>
      <section class="card" aria-label="Warnings">
        <h2>Checks</h2>
        <ul id="warnings"></ul>
        <div id="error" role="alert"></div>
        <p class="note" id="okmsg"></p>
      </section>
    </div>
    <div class="stack">
      <section class="card" aria-label="Predictions">
        <div class="readouts">
          <div class="readout">
            <div class="label"><span class="swatch" style="background:var(--solver)"></span>Solver</div>
            <div class="big" id="r-solver-cl">-</div><div class="small" id="r-solver-cm">-</div>
          </div>
          <div class="readout">
            <div class="label"><span class="swatch" style="background:var(--net)"></span>
              <span id="net-name">Network</span></div>
            <div class="big" id="r-net-cl">-</div><div class="small" id="r-net-cm">-</div>
          </div>
          <div class="readout">
            <div class="label">Network minus solver</div>
            <div class="big" id="r-diff-cl">-</div><div class="small" id="r-diff-cm">-</div>
          </div>
        </div>
        <p class="note" id="timing"></p>
      </section>
      <section class="card" aria-label="Aerofoil">
        <div class="tabs">
          <h2 style="margin:0">Aerofoil</h2>
          <span class="spacer"></span>
          <label class="checks" style="margin:0"><input type="checkbox" id="show-panels">
            show the panel points</label>
        </div>
        <svg id="foil" viewBox="-0.06 -0.22 1.2 0.44" role="img"
             aria-label="Outline of the aerofoil with the free-stream direction"></svg>
      </section>
      <section class="card" aria-label="Plot">
        <div class="tabs" role="group" aria-label="Plot type">
          <button type="button" data-tab="cl" aria-pressed="true">Cl against angle</button>
          <button type="button" data-tab="cm" aria-pressed="false">Cm against angle</button>
          <button type="button" data-tab="cp" aria-pressed="false">Pressure (Cp)</button>
        </div>
        <div class="wrap">
          <svg id="plot" viewBox="0 0 720 360" role="img" aria-label="Plot"></svg>
          <div id="tip"></div>
        </div>
        <div class="legend" id="legend"></div>
        <p class="note" id="plotnote"></p>
        <details id="table"><summary>Show the numbers as a table</summary>
          <div class="scroll" id="tablebody"></div></details>
      </section>
    </div>
  </div>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
const HINTS = {
  camber: "maximum camber, fraction of chord", camber_position: "chord position of the maximum",
  thickness: "maximum thickness, fraction of chord", alpha_deg: "angle of attack, degrees",
};
let info = null, values = {}, tab = "cl", result = null, inflight = false, dirty = false;

function hint(name) {
  if (HINTS[name]) return HINTS[name];
  const m = /^(a[ul])(\d+)$/.exec(name);
  if (!m) return "";
  return (m[1] === "au" ? "upper" : "lower") + " surface, shape coefficient " + m[2] +
    (m[2] === "0" ? " (nose)" : "");
}
const fmt = (v, d = 4) => (v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const step = (f) => (f.slider_max - f.slider_min) / 400;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function buildControls() {
  const box = $("sliders");
  box.textContent = "";
  for (const f of info.features) {
    const wrap = document.createElement("div"); wrap.className = "slider";
    const row = document.createElement("div"); row.className = "row";
    const label = document.createElement("label"); label.htmlFor = "s-" + f.name;
    label.textContent = f.name === "alpha_deg" ? "alpha" : f.name;
    const num = document.createElement("input"); num.type = "number"; num.id = "n-" + f.name;
    num.step = String(step(f)); num.setAttribute("aria-label", f.name + " value");
    row.append(label, num);
    const h = document.createElement("div"); h.className = "hint"; h.textContent = hint(f.name);
    const range = document.createElement("input"); range.type = "range"; range.id = "s-" + f.name;
    range.min = f.slider_min; range.max = f.slider_max; range.step = step(f);
    const a = 100 * (f.train_min - f.slider_min) / (f.slider_max - f.slider_min);
    const b = 100 * (f.train_max - f.slider_min) / (f.slider_max - f.slider_min);
    range.style.background = `linear-gradient(to right, var(--grid) ${a}%, var(--range) ${a}%, ` +
      `var(--range) ${b}%, var(--grid) ${b}%)`;
    const flag = document.createElement("div"); flag.className = "flag"; flag.id = "f-" + f.name;
    wrap.append(row, h, range, flag); box.append(wrap);
    const set = (v) => { values[f.name] = v; sync(); request(); };
    range.addEventListener("input", () => set(parseFloat(range.value)));
    num.addEventListener("change", () => { const v = parseFloat(num.value); if (isFinite(v)) set(v); });
  }
  const presets = $("presets"); presets.textContent = "";
  for (const p of info.presets) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = p.name;
    b.addEventListener("click", () => { Object.assign(values, p.values); sync(); request(); });
    presets.append(b);
  }
}

function sync() {
  for (const f of info.features) {
    const v = values[f.name];
    $("s-" + f.name).value = v;
    const n = $("n-" + f.name);
    if (document.activeElement !== n) n.value = Number(v.toFixed(4));
    $("f-" + f.name).textContent = (v < f.train_min || v > f.train_max)
      ? `outside the trained range (${f.train_min} to ${f.train_max})` : "";
  }
}

function request() {
  if (inflight) { dirty = true; return; }
  inflight = true; dirty = false;
  api("/api/evaluate", { ...values, sweep: true }).then((r) => {
    result = r; $("error").textContent = ""; render();
  }).catch((e) => { $("error").textContent = e.message; })
    .finally(() => { inflight = false; if (dirty) request(); });
}

// ---- drawing helpers ----
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.append(e);
  return e;
}
function text(parent, x, y, s, attrs = {}) {
  const t = el("text", { x, y, ...attrs }, parent); t.textContent = s; return t;
}
function niceTicks(lo, hi, n = 6) {
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const s = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p, out = [];
  for (let v = Math.ceil(lo / s) * s; v <= hi + 1e-9; v += s) out.push(Math.abs(v) < 1e-12 ? 0 : v);
  return out;
}
const tickText = (v) => String(Math.round(v * 1e6) / 1e6).replace("-", "−");

function drawFoil() {
  const svg = $("foil"); svg.textContent = "";
  const c = result.contour;
  const pts = c.x.map((x, i) => `${x},${-c.y[i]}`).join(" ");
  el("line", { x1: -0.04, y1: 0, x2: 1.1, y2: 0, stroke: "var(--grid)", "stroke-width": 0.004,
               "stroke-dasharray": "0.015 0.015" }, svg);
  el("polygon", { points: pts, fill: "var(--fill)", stroke: "var(--ink)", "stroke-width": 0.004,
                  "stroke-linejoin": "round" }, svg);
  if ($("show-panels").checked) {
    c.x.forEach((x, i) => el("circle", { cx: x, cy: -c.y[i], r: 0.0045, fill: "var(--solver)" }, svg));
  }
  // free-stream arrow: the flow direction as seen from the aerofoil
  const a = values.alpha_deg * Math.PI / 180, L = 0.2, x0 = -0.05, y0 = -0.17;
  const dx = Math.cos(a) * L, dy = Math.sin(a) * L; // chord-frame y points up, svg y down
  el("line", { x1: x0, y1: y0, x2: x0 + dx, y2: y0 + dy, stroke: "var(--ink-2)",
               "stroke-width": 0.005, "stroke-linecap": "round" }, svg);
  const hx = x0 + dx, hy = y0 + dy, ang = Math.atan2(dy, dx), h = 0.022;
  el("polygon", { points: `${hx},${hy} ${hx - h * Math.cos(ang - 0.4)},${hy - h * Math.sin(ang - 0.4)} ` +
    `${hx - h * Math.cos(ang + 0.4)},${hy - h * Math.sin(ang + 0.4)}`, fill: "var(--ink-2)" }, svg);
  text(svg, 0.2, -0.19, "free stream", { "font-size": 0.035, "font-family": "system-ui" });
}

function frame(svg, xr, yr, xlabel, ylabel, ydec = false) {
  const m = { l: 56, r: 16, t: 14, b: 40 }, W = 720, H = 360;
  const sx = (v) => m.l + (v - xr[0]) / (xr[1] - xr[0]) * (W - m.l - m.r);
  const sy = ydec ? (v) => m.t + (v - yr[0]) / (yr[1] - yr[0]) * (H - m.t - m.b)
                  : (v) => H - m.b - (v - yr[0]) / (yr[1] - yr[0]) * (H - m.t - m.b);
  for (const v of niceTicks(yr[0], yr[1])) {
    el("line", { x1: m.l, x2: W - m.r, y1: sy(v), y2: sy(v), stroke: "var(--grid)",
                 "stroke-width": v === 0 ? 1.5 : 1 }, svg);
    text(svg, m.l - 8, sy(v) + 4, tickText(v), { "text-anchor": "end" });
  }
  for (const v of niceTicks(xr[0], xr[1], 8)) {
    text(svg, sx(v), H - m.b + 18, tickText(v), { "text-anchor": "middle" });
  }
  text(svg, (m.l + W - m.r) / 2, H - 6, xlabel, { "text-anchor": "middle" });
  const yl = text(svg, 14, (m.t + H - m.b) / 2, ylabel, { "text-anchor": "middle" });
  yl.setAttribute("transform", `rotate(-90 14 ${(m.t + H - m.b) / 2})`);
  return { sx, sy, m, W, H };
}

function legendItem(color, label, kind) {
  const s = document.createElement("span");
  const sw = document.createElement("span");
  sw.className = kind === "band" ? "swatch" : "swatch line";
  sw.style.background = kind === "band" ? "var(--band)" : color;
  if (kind === "band") sw.style.outline = "1px solid var(--net)";
  if (kind === "dash") sw.style.background = `repeating-linear-gradient(90deg, ${color} 0 5px, transparent 5px 8px)`;
  s.append(sw, document.createTextNode(label)); return s;
}

function drawSweep(target) {
  const svg = $("plot"); svg.textContent = "";
  const sw = result.sweep, a = sw.alpha_deg, sol = sw.solver[target], net = sw.surrogate[target];
  const sp = sw.spread ? sw.spread[target] : null;
  const lo = net.map((v, i) => v - (sp ? sp[i] : 0)), hi = net.map((v, i) => v + (sp ? sp[i] : 0));
  let ymin = Math.min(0, ...sol, ...lo), ymax = Math.max(0, ...sol, ...hi);
  const pad = 0.06 * (ymax - ymin || 1); ymin -= pad; ymax += pad;
  const xr = [a[0], a[a.length - 1]];
  const f = frame(svg, xr, [ymin, ymax], "angle of attack (degrees)", target === "cl" ? "Cl" : "Cm (about c/4)");
  const [t0, t1] = sw.train_alpha;
  el("rect", { x: f.sx(t0), y: f.m.t, width: f.sx(t1) - f.sx(t0), height: f.H - f.m.t - f.m.b,
               fill: "var(--trained)" }, svg);
  text(svg, f.sx(t0) + 6, f.m.t + 14, "trained on these angles");
  if (sp) {
    const up = a.map((x, i) => `${f.sx(x)},${f.sy(hi[i])}`);
    const dn = a.map((x, i) => `${f.sx(x)},${f.sy(lo[i])}`).reverse();
    el("polygon", { points: up.concat(dn).join(" "), fill: "var(--band)" }, svg);
  }
  const line = (ys, color, dash) => el("polyline", { points: a.map((x, i) => `${f.sx(x)},${f.sy(ys[i])}`).join(" "),
    fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round",
    ...(dash ? { "stroke-dasharray": "6 4" } : {}) }, svg);
  line(sol, "var(--solver)"); line(net, "var(--net)", true);
  // current angle
  const x = f.sx(values.alpha_deg);
  el("line", { x1: x, x2: x, y1: f.m.t, y2: f.H - f.m.b, stroke: "var(--ink-2)", "stroke-width": 1,
               "stroke-dasharray": "2 3" }, svg);
  const cur = { cl: [result.solver.cl, result.surrogate.mean.cl], cm: [result.solver.cm, result.surrogate.mean.cm] }[target];
  el("circle", { cx: x, cy: f.sy(cur[0]), r: 5, fill: "var(--solver)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  el("circle", { cx: x, cy: f.sy(cur[1]), r: 5, fill: "var(--net)", stroke: "var(--surface)", "stroke-width": 2 }, svg);
  // hover
  const hover = el("line", { y1: f.m.t, y2: f.H - f.m.b, stroke: "var(--ink)", "stroke-width": 1, opacity: 0 }, svg);
  const hit = el("rect", { x: f.m.l, y: f.m.t, width: f.W - f.m.l - f.m.r, height: f.H - f.m.t - f.m.b,
                           fill: "transparent" }, svg);
  const tip = $("tip");
  hit.addEventListener("mousemove", (ev) => {
    const box = svg.getBoundingClientRect(), px = (ev.clientX - box.left) * f.W / box.width;
    const al = xr[0] + (px - f.m.l) / (f.W - f.m.l - f.m.r) * (xr[1] - xr[0]);
    let k = 0; for (let i = 1; i < a.length; i++) if (Math.abs(a[i] - al) < Math.abs(a[k] - al)) k = i;
    hover.setAttribute("x1", f.sx(a[k])); hover.setAttribute("x2", f.sx(a[k])); hover.setAttribute("opacity", 0.5);
    tip.textContent = `alpha ${fmt(a[k], 1)}°   solver ${fmt(sol[k])}   network ${fmt(net[k])}` +
      (sp ? ` ± ${sp[k].toFixed(4)}` : "");
    tip.style.display = "block";
    const wrap = tip.parentElement.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX - wrap.left + 12, wrap.width - tip.offsetWidth - 4) + "px";
    tip.style.top = (ev.clientY - wrap.top + 12) + "px";
  });
  hit.addEventListener("mouseleave", () => { tip.style.display = "none"; hover.setAttribute("opacity", 0); });

  const lg = $("legend"); lg.textContent = "";
  lg.append(legendItem("var(--solver)", "panel-method solver", "line"),
            legendItem("var(--net)", sp ? "network (ensemble mean)" : "network", "dash"));
  if (sp) lg.append(legendItem("var(--net)", "±1 spread between the networks", "band"));
  $("plotnote").textContent = "The solver is inviscid, so it has no stall: its lift keeps rising " +
    "at high angles, where a real aerofoil would stall. The network only imitates the solver, and " +
    "was trained between the angles shaded blue; outside them it is extrapolating. In my tests " +
    "the real error was 1.5 to 2 times the spread, so read the band as a lower bound.";
  fillTable(["alpha (deg)", "solver", "network", ...(sp ? ["spread"] : [])],
    a.map((x, i) => [x.toFixed(1), sol[i].toFixed(4), net[i].toFixed(4), ...(sp ? [sp[i].toFixed(4)] : [])]));
}

function drawCp() {
  const svg = $("plot"); svg.textContent = "";
  const cp = result.cp, art = cp.te_artifact;
  // a spurious spike on the trailing-edge panel is left out of the plot (it stays in the table)
  const shown = {
    upper: { x: cp.upper.x.slice(art.upper ? 1 : 0), cp: cp.upper.cp.slice(art.upper ? 1 : 0) },
    lower: { x: cp.lower.x.slice(0, art.lower ? -1 : undefined),
             cp: cp.lower.cp.slice(0, art.lower ? -1 : undefined) },
  };
  const all = shown.upper.cp.concat(shown.lower.cp);
  let ymin = Math.min(...all), ymax = Math.max(1, ...all);
  ymin = Math.min(ymin, -0.5);
  const f = frame(svg, [0, 1], [ymin - 0.05, ymax + 0.05], "x / chord", "Cp  (suction is up)", true);
  const line = (s, dash) => el("polyline", { points: s.x.map((x, i) => `${f.sx(x)},${f.sy(s.cp[i])}`).join(" "),
    fill: "none", stroke: "var(--solver)", "stroke-width": 2, "stroke-linejoin": "round",
    ...(dash ? { "stroke-dasharray": "6 4" } : {}) }, svg);
  line(shown.upper); line(shown.lower, true);
  const lg = $("legend"); lg.textContent = "";
  lg.append(legendItem("var(--solver)", "upper surface", "line"), legendItem("var(--solver)", "lower surface", "dash"));
  const cut = [art.upper && ["upper", cp.upper.cp[0]], art.lower && ["lower", cp.lower.cp[cp.lower.cp.length - 1]]]
    .filter(Boolean).map(([n, v]) => `${n} surface Cp ${fmt(v, 1)}`);
  $("plotnote").textContent = "The network predicts Cl and Cm only, so this plot is the solver's " +
    "pressure distribution alone." + (cut.length ? " The panel at the trailing edge (" + cut.join(", ") +
    ") is left out: on some shapes the solver puts a spurious suction spike there. It does not shrink " +
    "with more panels and barely affects Cl or Cm, since the panel is tiny. The table keeps it." : "");
  $("tip").style.display = "none";
  fillTable(["x / chord (upper)", "Cp upper", "x / chord (lower)", "Cp lower"],
    cp.upper.x.map((x, i) => [x.toFixed(4), cp.upper.cp[i].toFixed(4),
      i < cp.lower.x.length ? cp.lower.x[i].toFixed(4) : "", i < cp.lower.cp.length ? cp.lower.cp[i].toFixed(4) : ""]));
}

function fillTable(head, rows) {
  const t = document.createElement("table");
  const tr = t.insertRow();
  for (const h of head) { const th = document.createElement("th"); th.textContent = h; tr.append(th); }
  for (const r of rows) { const row = t.insertRow(); for (const c of r) row.insertCell().textContent = c; }
  const body = $("tablebody"); body.textContent = ""; body.append(t);
}

function render() {
  const r = result, mean = r.surrogate.mean, sd = r.surrogate.std;
  $("r-solver-cl").textContent = "Cl " + fmt(r.solver.cl);
  $("r-solver-cm").textContent = "Cm " + fmt(r.solver.cm);
  $("r-net-cl").textContent = "Cl " + fmt(mean.cl);
  $("r-net-cm").textContent = "Cm " + fmt(mean.cm);
  if (sd) {
    $("r-net-cl").textContent += " ± " + sd.cl.toPrecision(2);
    $("r-net-cm").textContent += " ± " + sd.cm.toPrecision(2);
  }
  $("r-diff-cl").textContent = "Cl " + fmt(mean.cl - r.solver.cl);
  $("r-diff-cm").textContent = "Cm " + fmt(mean.cm - r.solver.cm);
  $("timing").textContent = `One request: solver ${r.timing_ms.solver.toFixed(1)} ms (including ` +
    `building the panel matrix), network ${r.timing_ms.surrogate.toFixed(1)} ms.`;
  const w = $("warnings"); w.textContent = "";
  const msgs = [];
  if (r.outside.length) msgs.push("Outside the trained range: " + r.outside.join(", ") +
    ". The network is extrapolating; trust the solver, not the network.");
  for (const x of r.warnings) msgs.push(x);
  for (const m of msgs) { const li = document.createElement("li"); li.textContent = m; w.append(li); }
  $("okmsg").textContent = msgs.length ? "" : "Inside the trained range.";
  drawFoil();
  if (tab === "cp") drawCp(); else drawSweep(tab);
}

async function start() {
  info = await api("/api/info");
  $("sub").textContent = `${info.family === "cst" ? "CST" : "NACA 4-digit"} shapes, ` +
    `${info.n_members > 1 ? info.n_members + "-network ensemble" : "single network"} against ` +
    `a ${info.n_panels}-panel linear-vortex solver. The shaded part of each slider is the trained range.`;
  $("net-name").textContent = info.has_spread ? "Network (mean ± spread)" : "Network";
  values = { ...info.default };
  buildControls(); sync();
  $("reset").addEventListener("click", () => { values = { ...info.default }; sync(); request(); });
  $("show-panels").addEventListener("change", () => result && drawFoil());
  document.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
    if (result) render();
  }));
  request();
}
start().catch((e) => { $("sub").textContent = "Could not reach the server: " + e.message; });
</script>
</body>
</html>
